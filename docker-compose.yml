services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketing_timeline}
      POSTGRES_USER: ${POSTGRES_USER:-marketing_timeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-marketing-timeline}:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketing_timeline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketing_timeline}
      APP_ORIGIN: https://${APP_DOMAIN:-localhost}
      NEXTAUTH_URL: https://${APP_DOMAIN:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  worker:
    image: ${APP_IMAGE:-marketing-timeline}:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["pnpm", "worker"]
    env_file:
      - path: .env.production
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketing_timeline}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketing_timeline}
      APP_ORIGIN: https://${APP_DOMAIN:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]

networks:
  backend:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
