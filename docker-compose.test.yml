services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_DB: marketing_test
      POSTGRES_USER: marketing_test
      POSTGRES_PASSWORD: marketing_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing_test -d marketing_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
